
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | University of Abra</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
</head>
<body>
    <main style="min-height:75vh;display:flex;justify-content:center;align-items:center;padding:25px;">
        <section style="background:white;padding:35px;border:2px solid black;border-radius:15px;width:100%;max-width:420px;">
            <h1>Admin Login</h1>
            <p>University of Abra Administration</p>

            <form method="POST">
                <label for="username">Admin Username</label>
                <input id="username" name="username" type="text" required
                       placeholder="Enter admin username"
                       style="display:block;width:100%;padding:12px;margin:10px 0 18px;">

                <label for="password">Password</label>
                <input id="password" name="password" type="password" required
                       placeholder="Enter admin password"
                       style="display:block;width:100%;padding:12px;margin:10px 0 20px;">

                <button type="submit" style="width:100%;padding:12px;background:black;color:white;border:0;border-radius:25px;font-weight:bold;">
                    LOG IN
                </button>
            </form>

            <p style="margin-top:20px;">
                <a href="{{ url_for('login') }}">← Back to Login Options</a>
            </p>
        </section>
    </main>
</body>
</html>
